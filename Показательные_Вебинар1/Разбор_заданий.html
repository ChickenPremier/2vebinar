<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разбор заданий: Показательные уравнения и неравенства</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0F1117 0%, #1E222E 100%);
            color: #E5E7EB;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 {
            text-align: center; color: #FBBF24; font-size: 2.2rem;
            margin-bottom: 10px; text-shadow: 0 2px 20px rgba(251, 191, 36, 0.3);
        }
        .subtitle { text-align: center; color: #9CA3AF; font-size: 1.05rem; margin-bottom: 30px; }
        .group-title {
            color: #22D3EE; font-size: 1.35rem; font-weight: 700;
            margin: 30px 0 15px; padding-left: 12px;
            border-left: 4px solid #22D3EE;
        }
        .task-card {
            background: #171A23; border-radius: 10px; padding: 24px;
            border: 2px solid #2A2E3A; margin-bottom: 16px;
            transition: border-color 0.3s;
        }
        .task-card.open { border-color: #FBBF24; }
        .task-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .task-num {
            flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            color: #0F1117; font-weight: 800; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
        }
        .task-text { font-size: 1.35rem; color: #fff; flex: 1; min-width: 200px; }
        .method-badge {
            font-size: 0.8rem; font-weight: 700; color: #22D3EE;
            background: rgba(34, 211, 238, 0.12); border: 1px solid #22D3EE;
            padding: 4px 12px; border-radius: 20px; white-space: nowrap;
        }
        .toggle-btn {
            margin-top: 16px; padding: 12px 24px; font-size: 1rem; font-weight: 700;
            background: linear-gradient(135deg, #1E222E 0%, #252936 100%);
            border: 2px solid #FBBF24; border-radius: 8px; color: #FBBF24;
            cursor: pointer; transition: all 0.3s; font-family: inherit;
        }
        .toggle-btn:hover { background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%); color: #0F1117; }
        .steps { display: none; margin-top: 18px; }
        .task-card.open .steps { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .step {
            display: flex; gap: 12px; margin-bottom: 10px; align-items: flex-start;
            background: #1E222E; border-radius: 8px; padding: 12px 14px; line-height: 1.65;
        }
        .step-n {
            flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
            background: #2A2E3A; color: #FBBF24; font-weight: 700; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center; margin-top: 2px;
        }
        .answer {
            margin-top: 14px; padding: 14px 18px; border-radius: 8px;
            background: rgba(34, 211, 238, 0.1); border: 1px solid #22D3EE;
            font-size: 1.15rem; color: #fff;
        }
        .answer strong { color: #22D3EE; }
        sup { font-size: 0.68em; }
        .math { white-space: nowrap; }
        .footer { text-align: center; color: #6B7280; font-size: 0.9rem; margin: 30px 0 10px; }
        @media (max-width: 768px) {
            h1 { font-size: 1.6rem; }
            .task-text { font-size: 1.1rem; }
            .task-card { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Разбор заданий</h1>
        <div class="subtitle">8 типовых заданий с урока — пошаговые решения. Сначала реши сам, потом сверься!</div>
        <div id="tasksList"></div>
        <div class="footer">Показательные уравнения и неравенства · Вебинар 1</div>
    </div>

    <script>
        var tasks = [
            {
                group: 'Метод 1 · Приведение к одному основанию',
                method: 'Одно основание',
                task: '<span class="math">2<sup>x+1</sup> = 32</span>',
                steps: [
                    'Представим 32 как степень двойки: 32 = 2<sup>5</sup>. Уравнение: 2<sup>x+1</sup> = 2<sup>5</sup>.',
                    'Основания одинаковые — приравниваем показатели: x + 1 = 5.',
                    'x = 4.'
                ],
                answer: 'x = 4'
            },
            {
                group: 'Метод 1 · Приведение к одному основанию',
                method: 'Одно основание',
                task: '<span class="math">5<sup>3x−1</sup> = 25</span>',
                steps: [
                    '25 = 5<sup>2</sup>. Уравнение: 5<sup>3x−1</sup> = 5<sup>2</sup>.',
                    'Приравниваем показатели: 3x − 1 = 2.',
                    '3x = 3, значит x = 1.'
                ],
                answer: 'x = 1'
            },
            {
                group: 'Метод 1 · Приведение к одному основанию',
                method: 'Одно основание',
                task: '<span class="math">4<sup>x</sup> = 8<sup>x−1</sup></span>',
                steps: [
                    'Сводим всё к основанию 2: 4<sup>x</sup> = (2<sup>2</sup>)<sup>x</sup> = 2<sup>2x</sup>; 8<sup>x−1</sup> = (2<sup>3</sup>)<sup>x−1</sup> = 2<sup>3x−3</sup>.',
                    'Приравниваем показатели: 2x = 3x − 3.',
                    'x = 3.'
                ],
                answer: 'x = 3'
            },
            {
                group: 'Особый случай · Справа единица',
                method: 'aˣ = 1',
                task: '<span class="math">7<sup>2x+6</sup> = 1</span>',
                steps: [
                    'Единицу представляем как степень: 1 = 7<sup>0</sup>.',
                    'Показатель равен нулю: 2x + 6 = 0.',
                    'x = −3.'
                ],
                answer: 'x = −3'
            },
            {
                group: 'Метод 2 · Замена переменной',
                method: 'Замена t = aˣ',
                task: '<span class="math">9<sup>x</sup> − 4·3<sup>x</sup> − 45 = 0</span>',
                steps: [
                    'Замечаем: 9<sup>x</sup> = (3<sup>x</sup>)<sup>2</sup>. Вводим замену t = 3<sup>x</sup> &gt; 0.',
                    'Получаем квадратное уравнение: t<sup>2</sup> − 4t − 45 = 0. Корни: t = 9 и t = −5.',
                    'Отрицательный корень отбрасываем (t &gt; 0!). Остаётся 3<sup>x</sup> = 9 = 3<sup>2</sup>.',
                    'x = 2.'
                ],
                answer: 'x = 2'
            },
            {
                group: 'Метод 2 · Замена переменной',
                method: 'Замена t = aˣ',
                task: '<span class="math">4<sup>x</sup> − 5·2<sup>x</sup> + 4 = 0</span>',
                steps: [
                    'Замена t = 2<sup>x</sup> &gt; 0. Уравнение: t<sup>2</sup> − 5t + 4 = 0.',
                    'Корни: t = 1 и t = 4 (оба положительные — оба подходят).',
                    '2<sup>x</sup> = 1 ⇒ x = 0; &nbsp;2<sup>x</sup> = 4 ⇒ x = 2.'
                ],
                answer: 'x = 0 или x = 2 (сумма корней: 2)'
            },
            {
                group: 'Метод 3 · Неравенства: следи за знаком!',
                method: 'Знак и основание',
                task: '<span class="math">(1/3)<sup>x</sup> &lt; 9</span>',
                steps: [
                    'Приводим к основанию 1/3: 9 = 3<sup>2</sup> = (1/3)<sup>−2</sup>. Неравенство: (1/3)<sup>x</sup> &lt; (1/3)<sup>−2</sup>.',
                    'Основание 1/3 &lt; 1 — функция убывает, поэтому знак МЕНЯЕМ: x &gt; −2.'
                ],
                answer: 'x &gt; −2'
            },
            {
                group: 'Метод 3 · Неравенства: следи за знаком!',
                method: 'Замена + знак',
                task: '<span class="math">4<sup>x</sup> − 3·2<sup>x</sup> − 4 ≥ 0</span>',
                steps: [
                    'Замена t = 2<sup>x</sup> &gt; 0: t<sup>2</sup> − 3t − 4 ≥ 0, то есть (t − 4)(t + 1) ≥ 0.',
                    'Парабола ветвями вверх: t ≤ −1 или t ≥ 4. Но t &gt; 0, поэтому остаётся t ≥ 4.',
                    '2<sup>x</sup> ≥ 4 = 2<sup>2</sup>. Основание 2 &gt; 1 — знак сохраняем: x ≥ 2.'
                ],
                answer: 'x ≥ 2 (наименьшее целое: 2)'
            }
        ];

        var list = document.getElementById('tasksList');
        var lastGroup = '';
        tasks.forEach(function (t, i) {
            if (t.group !== lastGroup) {
                var g = document.createElement('div');
                g.className = 'group-title';
                g.textContent = t.group;
                list.appendChild(g);
                lastGroup = t.group;
            }
            var card = document.createElement('div');
            card.className = 'task-card';
            card.innerHTML =
                '<div class="task-head">' +
                    '<div class="task-num">' + (i + 1) + '</div>' +
                    '<div class="task-text">' + t.task + '</div>' +
                    '<div class="method-badge">' + t.method + '</div>' +
                '</div>' +
                '<button class="toggle-btn">Показать решение</button>' +
                '<div class="steps">' +
                    t.steps.map(function (s, k) {
                        return '<div class="step"><div class="step-n">' + (k + 1) + '</div><div>' + s + '</div></div>';
                    }).join('') +
                    '<div class="answer"><strong>Ответ:</strong> ' + t.answer + '</div>' +
                '</div>';
            var btn = card.querySelector('.toggle-btn');
            btn.addEventListener('click', function () {
                var open = card.classList.toggle('open');
                btn.textContent = open ? 'Скрыть решение' : 'Показать решение';
            });
            list.appendChild(card);
        });
    </script>
</body>
</html>
