<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз: Показательные уравнения и неравенства</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0F1117 0%, #1E222E 100%);
            color: #E5E7EB;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #FBBF24;
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 20px rgba(251, 191, 36, 0.3);
        }
        
        .score-panel {
            background: #171A23;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #2A2E3A;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .score-item {
            text-align: center;
        }
        
        .score-label {
            color: #9CA3AF;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .score-value {
            color: #FBBF24;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #2A2E3A;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FBBF24 0%, #F59E0B 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .quiz-card {
            background: #171A23;
            border-radius: 10px;
            padding: 35px;
            border: 2px solid #2A2E3A;
            margin-bottom: 20px;
        }
        
        .question-number {
            color: #9CA3AF;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .question-text {
            color: #E5E7EB;
            font-size: 1.4rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .equation-box {
            background: linear-gradient(135deg, #1E222E 0%, #252936 100%);
            border: 2px solid #FBBF24;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            font-size: 2rem;
            font-family: 'Courier New', monospace;
            color: #FBBF24;
            margin-bottom: 25px;
        }
        
        .options {
            display: grid;
            gap: 12px;
        }
        
        .option {
            background: linear-gradient(135deg, #1E222E 0%, #252936 100%);
            border: 2px solid #2A2E3A;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .option:hover {
            border-color: #FBBF24;
            transform: translateX(5px);
        }
        
        .option-letter {
            width: 36px;
            height: 36px;
            background: #2A2E3A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #9CA3AF;
            font-size: 1.1rem;
            flex-shrink: 0;
            font-family: 'Courier New', monospace;
        }
        
        .option-text {
            color: #D1D5DB;
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
        }
        
        .option.selected {
            border-color: #FBBF24;
            background: linear-gradient(135deg, #2A2418 0%, #352D20 100%);
        }
        
        .option.selected .option-letter {
            background: #FBBF24;
            color: #0F1117;
        }
        
        .option.correct {
            border-color: #10B981;
            background: linear-gradient(135deg, #0D2818 0%, #153525 100%);
            animation: correctPulse 0.5s;
        }
        
        .option.correct .option-letter {
            background: #10B981;
            color: #fff;
        }
        
        .option.incorrect {
            border-color: #EF4444;
            background: linear-gradient(135deg, #2A1818 0%, #352020 100%);
            animation: incorrectShake 0.5s;
        }
        
        .option.incorrect .option-letter {
            background: #EF4444;
            color: #fff;
        }
        
        .option.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .feedback.show {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        .feedback.correct {
            background: linear-gradient(135deg, #0D2818 0%, #153525 100%);
            border: 2px solid #10B981;
        }
        
        .feedback.incorrect {
            background: linear-gradient(135deg, #2A1818 0%, #352020 100%);
            border: 2px solid #EF4444;
        }
        
        .feedback-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        
        .feedback.correct .feedback-title {
            color: #10B981;
        }
        
        .feedback.incorrect .feedback-title {
            color: #EF4444;
        }
        
        .feedback-text {
            color: #D1D5DB;
            line-height: 1.7;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            color: #0F1117;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 15px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-card {
            background: #171A23;
            border-radius: 10px;
            padding: 50px;
            border: 2px solid #FBBF24;
            text-align: center;
            display: none;
        }
        
        .results-card.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        .results-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        
        .results-title {
            color: #FBBF24;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        
        .results-score {
            font-size: 2.5rem;
            color: #E5E7EB;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .results-message {
            color: #9CA3AF;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        
        .results-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-item {
            background: linear-gradient(135deg, #1E222E 0%, #252936 100%);
            padding: 20px;
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-value.correct { color: #10B981; }
        .stat-value.incorrect { color: #EF4444; }
        .stat-value.percent { color: #FBBF24; }
        
        .stat-label {
            color: #9CA3AF;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 1.4rem;
                margin-bottom: 15px;
            }
            
            .score-panel {
                padding: 12px 8px;
                gap: 10px;
            }
            
            .score-value {
                font-size: 1.4rem;
            }
            
            .quiz-card {
                padding: 18px 14px;
            }
            
            .question-text {
                font-size: 1.05rem;
            }
            
            .equation-box {
                font-size: 1.4rem;
                padding: 15px;
            }
            
            .option-text {
                font-size: 0.95rem;
            }
            
            .results-stats {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .results-card {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Квиз: Показательные уравнения и неравенства</h1>
        
        <div class="score-panel">
            <div class="score-item">
                <div class="score-label">Вопрос</div>
                <div class="score-value"><span id="currentQuestion">1</span>/<span id="totalQuestions">12</span></div>
            </div>
            <div class="score-item">
                <div class="score-label">Правильно</div>
                <div class="score-value" id="correctCount">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Неправильно</div>
                <div class="score-value" id="incorrectCount">0</div>
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div id="quizContainer"></div>
        
        <div class="results-card" id="resultsCard">
            <div class="results-icon" id="resultsIcon">🎉</div>
            <div class="results-title">Квиз завершен!</div>
            <div class="results-score"><span id="finalScore">0</span>/<span id="finalTotal">12</span></div>
            <div class="results-message" id="resultsMessage">Отличный результат!</div>
            
            <div class="results-stats">
                <div class="stat-item">
                    <div class="stat-value correct" id="finalCorrect">0</div>
                    <div class="stat-label">Правильных ответов</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value incorrect" id="finalIncorrect">0</div>
                    <div class="stat-label">Неправильных ответов</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value percent" id="finalPercent">0%</div>
                    <div class="stat-label">Процент правильных</div>
                </div>
            </div>
            
            <button class="btn" onclick="restartQuiz()">Начать заново</button>
        </div>
    </div>
    
    <script>
        const questions = [
            {
                question: "Решите уравнение:",
                equation: "2ˣ = 32",
                options: ["4", "5", "6", "16"],
                correct: 1,
                explanation: "32 = 2⁵, поэтому 2ˣ = 2⁵ → x = 5."
            },
            {
                question: "Решите уравнение:",
                equation: "3ˣ = 1/27",
                options: ["3", "-3", "1/3", "-1/3"],
                correct: 1,
                explanation: "1/27 = 3⁻³, поэтому 3ˣ = 3⁻³ → x = -3."
            },
            {
                question: "Решите уравнение:",
                equation: "9ˣ = 81",
                options: ["2", "9", "3", "√2"],
                correct: 0,
                explanation: "Представим 9ˣ = (3²)ˣ = 3²ˣ и 81 = 3⁴. Тогда 2x = 4 → x = 2."
            },
            {
                question: "Решите уравнение:",
                equation: "5ˣ = 625",
                options: ["2", "3", "4", "5"],
                correct: 2,
                explanation: "625 = 5⁴, поэтому x = 4."
            },
            {
                question: "Решите уравнение:",
                equation: "3ˣ⁺² = 27",
                options: ["1", "2", "3", "25"],
                correct: 0,
                explanation: "27 = 3³ → x + 2 = 3 → x = 1."
            },
            {
                question: "Решите неравенство:",
                equation: "2ˣ > 16",
                options: ["x > 4", "x < 4", "x > 8", "x ≥ 4"],
                correct: 0,
                explanation: "2ˣ > 2⁴. Основание 2 > 1, знак сохраняем: x > 4. Ответ: (4; +∞)."
            },
            {
                question: "Решите неравенство:",
                equation: "(1/2)ˣ > 8",
                options: ["x > -3", "x < -3", "x > 3", "x < 3"],
                correct: 1,
                explanation: "(1/2)ˣ = 2⁻ˣ, 8 = 2³. Получаем 2⁻ˣ > 2³ → -x > 3 → x < -3."
            },
            {
                question: "Решите уравнение (замена):",
                equation: "4ˣ − 5·2ˣ + 4 = 0",
                options: ["x = 0", "x = 1", "x = 0 и x = 2", "x = 1 и x = 2"],
                correct: 2,
                explanation: "Замена t = 2ˣ: t² − 5t + 4 = 0 → t = 1 или t = 4. 2ˣ = 1 → x = 0; 2ˣ = 4 → x = 2."
            },
            {
                question: "Решите уравнение:",
                equation: "2ˣ⁺¹ + 2ˣ = 24",
                options: ["x = 2", "x = 3", "x = 4", "x = 5"],
                correct: 1,
                explanation: "Выносим 2ˣ: 2ˣ(2 + 1) = 24 → 3·2ˣ = 24 → 2ˣ = 8 → x = 3."
            },
            {
                question: "Решите неравенство:",
                equation: "(0,5)ˣ < 0,25",
                options: ["x > 2", "x < 2", "x > -2", "x < -2"],
                correct: 0,
                explanation: "(0,5)ˣ < (0,5)². Основание 0,5 < 1 → функция убывает → знак меняем: x > 2."
            },
            {
                question: "Какое из чисел больше?",
                equation: "2,1⁵ или 2,1⁷",
                options: ["2,1⁵", "2,1⁷", "Они равны", "Нельзя сравнить"],
                correct: 1,
                explanation: "Основание 2,1 > 1 → функция возрастает. Чем больше показатель, тем значение больше: 2,1⁷ > 2,1⁵."
            },
            {
                question: "Решите уравнение:",
                equation: "7ˣ²⁻³ˣ = 1",
                options: ["x = 0", "x = 3", "x = 0 и x = 3", "x = 1 и x = 2"],
                correct: 2,
                explanation: "1 = 7⁰, значит x² − 3x = 0 → x(x − 3) = 0 → x = 0 или x = 3."
            }
        ];
        
        let currentQuestionIndex = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let selectedAnswer = null;
        let answered = false;
        
        function renderQuestion() {
            const question = questions[currentQuestionIndex];
            const container = document.getElementById('quizContainer');
            
            let optionsHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            
            question.options.forEach((option, index) => {
                optionsHTML += `
                    <div class="option" onclick="selectOption(${index})">
                        <div class="option-letter">${letters[index]}</div>
                        <div class="option-text">${option}</div>
                    </div>
                `;
            });
            
            container.innerHTML = `
                <div class="quiz-card">
                    <div class="question-number">Вопрос ${currentQuestionIndex + 1} из ${questions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="equation-box">${question.equation}</div>
                    <div class="options" id="optionsContainer">
                        ${optionsHTML}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Следующий вопрос</button>
                </div>
            `;
            
            updateProgress();
        }
        
        function selectOption(index) {
            if (answered) return;
            
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[index].classList.add('selected');
            
            selectedAnswer = index;
            document.getElementById('nextBtn').disabled = false;
        }
        
        function nextQuestion() {
            if (!answered) {
                checkAnswer();
            } else {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    answered = false;
                    selectedAnswer = null;
                    renderQuestion();
                } else {
                    showResults();
                }
            }
        }
        
        function checkAnswer() {
            if (selectedAnswer === null) return;
            
            answered = true;
            const question = questions[currentQuestionIndex];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            
            options.forEach(opt => opt.classList.add('disabled'));
            
            if (selectedAnswer === question.correct) {
                options[selectedAnswer].classList.add('correct');
                feedback.className = 'feedback correct show';
                feedback.innerHTML = `
                    <div class="feedback-title">✓ Правильно!</div>
                    <div class="feedback-text">${question.explanation}</div>
                `;
                correctAnswers++;
                document.getElementById('correctCount').textContent = correctAnswers;
            } else {
                options[selectedAnswer].classList.add('incorrect');
                options[question.correct].classList.add('correct');
                feedback.className = 'feedback incorrect show';
                feedback.innerHTML = `
                    <div class="feedback-title">✗ Неправильно</div>
                    <div class="feedback-text">${question.explanation}</div>
                `;
                incorrectAnswers++;
                document.getElementById('incorrectCount').textContent = incorrectAnswers;
            }
            
            nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 'Показать результаты' : 'Следующий вопрос';
        }
        
        function updateProgress() {
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQuestions').textContent = questions.length;
            
            const progress = ((currentQuestionIndex) / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        function showResults() {
            document.getElementById('quizContainer').style.display = 'none';
            const resultsCard = document.getElementById('resultsCard');
            resultsCard.classList.add('show');
            
            const percentage = Math.round((correctAnswers / questions.length) * 100);
            
            document.getElementById('finalScore').textContent = correctAnswers;
            document.getElementById('finalTotal').textContent = questions.length;
            document.getElementById('finalCorrect').textContent = correctAnswers;
            document.getElementById('finalIncorrect').textContent = incorrectAnswers;
            document.getElementById('finalPercent').textContent = percentage + '%';
            
            let icon = '🎉';
            let message = 'Отличный результат!';
            
            if (percentage === 100) {
                icon = '🏆';
                message = 'Идеально! Показательные уравнения — ваша суперсила!';
            } else if (percentage >= 80) {
                icon = '🌟';
                message = 'Превосходно! Отличная подготовка к ЕГЭ!';
            } else if (percentage >= 60) {
                icon = '👍';
                message = 'Хорошо! Обратите внимание на метод замены.';
            } else if (percentage >= 40) {
                icon = '📚';
                message = 'Неплохо, но стоит повторить свойства степеней.';
            } else {
                icon = '💪';
                message = 'Нужно больше практики. Попробуйте еще раз!';
            }
            
            document.getElementById('resultsIcon').textContent = icon;
            document.getElementById('resultsMessage').textContent = message;
            
            document.getElementById('progressFill').style.width = '100%';
        }
        
        function restartQuiz() {
            currentQuestionIndex = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            selectedAnswer = null;
            answered = false;
            
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('incorrectCount').textContent = '0';
            document.getElementById('resultsCard').classList.remove('show');
            document.getElementById('quizContainer').style.display = 'block';
            
            renderQuestion();
        }
        
        renderQuestion();
    </script>
</body>
</html>
