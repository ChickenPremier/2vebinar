<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Градусы ↔ Радианы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg,#0F1117 0%,#1E222E 100%); color: #E5E7EB; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #FBBF24; font-size: 2.2rem; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #9CA3AF; margin-bottom: 25px; }
        .panel { background: #171A23; border-radius: 10px; padding: 25px; border: 2px solid #2A2E3A; margin-bottom: 20px; }
        .panel h2 { color: #22D3EE; margin-bottom: 15px; font-size: 1.3rem; }
        .conv { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
        label { display: block; color: #9CA3AF; font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; }
        input, select { width: 100%; padding: 14px; background: #0F1117; border: 2px solid #2A2E3A; border-radius: 8px; color: #fff; font-size: 1.2rem; font-family: inherit; }
        input:focus { outline: none; border-color: #FBBF24; }
        .eq { font-size: 2rem; color: #FBBF24; padding-bottom: 10px; }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
        .chip { padding: 8px 14px; background: #1E222E; border: 2px solid #2A2E3A; border-radius: 20px; color: #D1D5DB; cursor: pointer; font-weight: 700; font-family: inherit; }
        .chip:hover { border-color: #FBBF24; }
        .q-card { background: #171A23; border-radius: 10px; padding: 30px; border: 2px solid #FBBF24; text-align: center; }
        .q-text { font-size: 2rem; color: #fff; margin-bottom: 20px; }
        .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .opt { padding: 16px; background: #1E222E; border: 2px solid #2A2E3A; border-radius: 8px; color: #E5E7EB; font-size: 1.25rem; cursor: pointer; font-family: inherit; }
        .opt:hover { border-color: #FBBF24; }
        .opt.ok { border-color: #10B981; background: rgba(16,185,129,0.15); }
        .opt.bad { border-color: #EF4444; background: rgba(239,68,68,0.15); }
        .score { text-align: center; color: #9CA3AF; margin-top: 12px; }
        .score strong { color: #FBBF24; }
        .rule { background: rgba(34,211,238,0.08); border: 1px solid #22D3EE; border-radius: 8px; padding: 15px; line-height: 1.8; color: #D1D5DB; }
        @media (max-width: 768px) { h1 { font-size: 1.5rem; } .conv { grid-template-columns: 1fr; } .eq { display: none; } .opts { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Градусы ↔ Радианы</h1>
        <div class="subtitle">Перевод π = 180° — нужен для заданий с π/6, π/4, π/3 из вебинара</div>
        <div class="panel">
            <h2>Калькулятор-переводчик</h2>
            <div class="conv">
                <div><label>Градусы</label><input type="number" id="degIn" value="60" oninput="fromDeg()"></div>
                <div class="eq">=</div>
                <div><label>Радианы (доля π)</label><input type="text" id="radIn" value="π/3" oninput="fromRad()"></div>
            </div>
            <div class="chips">
                <button class="chip" onclick="setD(30)">30°</button>
                <button class="chip" onclick="setD(45)">45°</button>
                <button class="chip" onclick="setD(60)">60°</button>
                <button class="chip" onclick="setD(90)">90°</button>
                <button class="chip" onclick="setD(120)">120°</button>
                <button class="chip" onclick="setD(150)">150°</button>
                <button class="chip" onclick="setD(180)">180°</button>
                <button class="chip" onclick="setD(225)">225°</button>
            </div>
            <div style="margin-top:15px" class="rule">Правило: радианы = градусы · π / 180. Запомни базу: 30° = π/6 · 45° = π/4 · 60° = π/3 · 90° = π/2 · 180° = π.</div>
        </div>
        <div class="q-card">
            <h2 style="color:#FBBF24;margin-bottom:15px">Мини-тест: переведи</h2>
            <div class="q-text" id="qText">…</div>
            <div class="opts" id="opts"></div>
            <div class="score" id="score">Верно: <strong>0</strong> · Ошибки: <strong>0</strong></div>
        </div>
    </div>
    <script>
        var MAP = [[0,'0'],[30,'π/6'],[45,'π/4'],[60,'π/3'],[90,'π/2'],[120,'2π/3'],[135,'3π/4'],[150,'5π/6'],[180,'π'],[210,'7π/6'],[225,'5π/4'],[270,'3π/2'],[360,'2π']];
        function degToRad(d){ for (var i=0;i<MAP.length;i++) if (MAP[i][0]===d) return MAP[i][1]; var g = gcd(d,180); return (d/g)+'π/'+(180/g); }
        function gcd(a,b){ return b ? gcd(b, a%b) : a; }
        function setD(d){ document.getElementById('degIn').value = d; fromDeg(); }
        function fromDeg(){ var d = parseFloat(document.getElementById('degIn').value); if (isNaN(d)) return; document.getElementById('radIn').value = degToRad(d); }
        function fromRad(){
            var s = document.getElementById('radIn').value.trim().replace(/\s/g,'');
            var m = s.match(/^(-?\d*\.?\d*)?π(?:\/(\d+\.?\d*))?$/);
            var deg = NaN;
            if (m) { var num = m[1] === '' || m[1] === undefined ? 1 : parseFloat(m[1]); if (isNaN(num)) num = 1; var den = m[2] ? parseFloat(m[2]) : 1; deg = num/den*180; }
            else if (/^-?\d+(\.\d+)?$/.test(s)) deg = parseFloat(s)*180/Math.PI;
            if (!isNaN(deg)) document.getElementById('degIn').value = Math.round(deg*100)/100;
        }
        var okN = 0, badN = 0, cur = null;
        function nextQ(){
            var pair = MAP[Math.floor(Math.random()*MAP.length)];
            var dir = Math.random() < 0.5;
            cur = dir ? {q: pair[0]+'° = ?', ans: pair[1]} : {q: pair[1]+' = ?', ans: pair[0]+'°'};
            document.getElementById('qText').textContent = cur.q;
            var pool = dir ? MAP.map(function(x){return x[1];}) : MAP.map(function(x){return x[0]+'°';});
            var opts = [cur.ans];
            while (opts.length < 4) { var v = pool[Math.floor(Math.random()*pool.length)]; if (opts.indexOf(v)<0) opts.push(v); }
            opts.sort(function(){return Math.random()-0.5;});
            var box = document.getElementById('opts'); box.innerHTML = '';
            opts.forEach(function(o){
                var b = document.createElement('button'); b.className = 'opt'; b.textContent = o;
                b.onclick = function(){
                    var all = box.querySelectorAll('.opt'); all.forEach(function(x){ x.disabled = true; if (x.textContent === cur.ans) x.classList.add('ok'); });
                    if (o === cur.ans) { okN++; } else { b.classList.add('bad'); badN++; }
                    document.getElementById('score').innerHTML = 'Верно: <strong>'+okN+'</strong> · Ошибки: <strong>'+badN+'</strong>';
                    setTimeout(nextQ, o === cur.ans ? 600 : 1500);
                };
                box.appendChild(b);
            });
        }
        fromDeg(); nextQ();
    </script>
</body>
</html>
