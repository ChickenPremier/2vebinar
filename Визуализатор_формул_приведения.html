<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуализатор формул приведения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0F1117 0%, #1E222E 100%);
            color: #E5E7EB;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #FBBF24;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 0 2px 20px rgba(251, 191, 36, 0.3);
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .panel {
            background: #171A23;
            border-radius: 10px;
            padding: 30px;
            border: 2px solid #2A2E3A;
        }
        
        .panel h2 {
            color: #FBBF24;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            display: block;
            color: #9CA3AF;
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .input-row {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        select, input[type="number"] {
            flex: 1;
            padding: 12px;
            background: #2A2E3A;
            border: 2px solid #3A3E4A;
            border-radius: 6px;
            color: #E5E7EB;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #FBBF24;
        }
        
        .angle-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .angle-btn {
            padding: 10px;
            background: linear-gradient(135deg, #1E222E 0%, #252936 100%);
            border: 2px solid #2A2E3A;
            border-radius: 6px;
            color: #D1D5DB;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .angle-btn:hover {
            border-color: #FBBF24;
            transform: translateY(-2px);
        }
        
        .angle-btn.active {
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            color: #0F1117;
            border-color: #FBBF24;
        }
        
        .result-panel {
            background: linear-gradient(135deg, #1E222E 0%, #252936 100%);
            border: 3px solid #FBBF24;
            border-radius: 10px;
            padding: 30px;
            margin: 25px 0;
            text-align: center;
        }
        
        .result-expression {
            color: #E5E7EB;
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .result-equals {
            color: #22D3EE;
            font-size: 2rem;
            margin: 15px 0;
        }
        
        .result-answer {
            color: #FBBF24;
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 15px;
        }
        
        .steps-container {
            margin-top: 30px;
        }
        
        .step {
            background: linear-gradient(135deg, #1E222E 0%, #252936 100%);
            border-left: 4px solid #22D3EE;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        
        .step:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.2);
        }
        
        .step-number {
            display: inline-block;
            background: #22D3EE;
            color: #0F1117;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-weight: 700;
            margin-right: 15px;
        }
        
        .step-title {
            color: #22D3EE;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }
        
        .step-content {
            color: #D1D5DB;
            font-size: 1rem;
            line-height: 1.8;
            margin-left: 45px;
        }
        
        .step-formula {
            background: #0F1117;
            border: 1px solid #2A2E3A;
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            color: #FBBF24;
            font-size: 1.1rem;
        }
        
        .formula-reference {
            background: #171A23;
            border: 2px solid #2A2E3A;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .formula-reference h3 {
            color: #FBBF24;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .formula-list {
            display: grid;
            gap: 12px;
        }
        
        .formula-item {
            background: linear-gradient(135deg, #1E222E 0%, #252936 100%);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #22D3EE;
        }
        
        .formula-item-title {
            color: #9CA3AF;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        
        .formula-item-text {
            color: #E5E7EB;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
        }
        
        .canvas-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        
        canvas {
            border: 2px solid #FBBF24;
            border-radius: 8px;
            background: #0F1117;
        }
        
        .btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            color: #0F1117;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
        }
        
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .angle-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📐 Визуализатор формул приведения</h1>
        
        <div class="main-grid">
            <div class="panel">
                <h2>Настройки</h2>
                
                <div class="input-section">
                    <div class="input-group">
                        <label class="input-label">Функция:</label>
                        <select id="functionSelect" onchange="calculate()">
                            <option value="sin">sin</option>
                            <option value="cos">cos</option>
                            <option value="tg">tg</option>
                            <option value="ctg">ctg</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Базовая формула:</label>
                        <select id="baseFormulaSelect" onchange="calculate()">
                            <option value="90+">90° + α</option>
                            <option value="90-">90° - α</option>
                            <option value="180+">180° + α</option>
                            <option value="180-">180° - α</option>
                            <option value="270+">270° + α</option>
                            <option value="270-">270° - α</option>
                            <option value="360+">360° + α</option>
                            <option value="360-">360° - α</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Угол α (градусы):</label>
                        <input type="number" id="angleInput" value="30" min="0" max="360" oninput="calculate()">
                        
                        <div class="angle-buttons">
                            <button class="angle-btn" onclick="setAngle(0)">0°</button>
                            <button class="angle-btn active" onclick="setAngle(30)">30°</button>
                            <button class="angle-btn" onclick="setAngle(45)">45°</button>
                            <button class="angle-btn" onclick="setAngle(60)">60°</button>
                        </div>
                    </div>
                </div>
                
                <div class="canvas-container">
                    <canvas id="circleCanvas" width="400" height="400"></canvas>
                </div>
                
                <div class="formula-reference">
                    <h3>Справка по формулам</h3>
                    <div class="formula-list">
                        <div class="formula-item">
                            <div class="formula-item-title">90° ± α</div>
                            <div class="formula-item-text">Функция меняется (sin ↔ cos)</div>
                        </div>
                        <div class="formula-item">
                            <div class="formula-item-title">180° ± α</div>
                            <div class="formula-item-text">Функция не меняется</div>
                        </div>
                        <div class="formula-item">
                            <div class="formula-item-title">270° ± α</div>
                            <div class="formula-item-text">Функция меняется (sin ↔ cos)</div>
                        </div>
                        <div class="formula-item">
                            <div class="formula-item-title">360° ± α</div>
                            <div class="formula-item-text">Функция не меняется</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="panel">
                <h2>Решение</h2>
                
                <div class="result-panel">
                    <div class="result-expression" id="expression">sin(90° + 30°)</div>
                    <div class="result-equals">=</div>
                    <div class="result-answer" id="answer">cos 30° = √3/2</div>
                </div>
                
                <div class="steps-container" id="stepsContainer">
                    <!-- Steps will be added dynamically -->
                </div>
                
                <button class="btn" onclick="generateRandom()">Случайный пример</button>
            </div>
        </div>
    </div>
    
    <script>
        function setAngle(angle) {
            document.getElementById('angleInput').value = angle;
            
            const buttons = document.querySelectorAll('.angle-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            calculate();
        }
        
        function calculate() {
            const func = document.getElementById('functionSelect').value;
            const baseFormula = document.getElementById('baseFormulaSelect').value;
            const alpha = parseInt(document.getElementById('angleInput').value);
            
            let resultFunc = func;
            let sign = '+';
            let baseAngle = 0;
            let resultAngle = alpha;
            let explanation = '';
            
            // Parse base formula
            if (baseFormula.includes('90')) baseAngle = 90;
            else if (baseFormula.includes('180')) baseAngle = 180;
            else if (baseFormula.includes('270')) baseAngle = 270;
            else if (baseFormula.includes('360')) baseAngle = 360;
            
            const operation = baseFormula.includes('+') ? '+' : '-';
            const fullAngle = operation === '+' ? baseAngle + alpha : baseAngle - alpha;
            
            // Apply reduction formulas
            const steps = [];
            
            // Step 1: Original expression
            steps.push({
                title: 'Исходное выражение',
                content: `Нам нужно упростить ${func}(${baseAngle}° ${operation} ${alpha}°) = ${func}(${fullAngle}°)`,
                formula: `${func}(${baseAngle}° ${operation} ${alpha}°)`
            });
            
            // Step 2: Determine function change
            if (baseAngle === 90 || baseAngle === 270) {
                if (func === 'sin') resultFunc = 'cos';
                else if (func === 'cos') resultFunc = 'sin';
                else if (func === 'tg') resultFunc = 'ctg';
                else if (func === 'ctg') resultFunc = 'tg';
                
                explanation = `Углы вида ${baseAngle}° ± α: функция меняется (sin ↔ cos, tg ↔ ctg)`;
            } else {
                explanation = `Углы вида ${baseAngle}° ± α: функция не меняется`;
            }
            
            steps.push({
                title: 'Определяем смену функции',
                content: explanation,
                formula: `${func} → ${resultFunc}`
            });
            
            // Step 3: Determine sign
            const quadrant = Math.floor(fullAngle / 90) % 4;
            let signPositive = true;
            
            if (func === 'sin' || resultFunc === 'sin') {
                signPositive = quadrant === 0 || quadrant === 1;
            } else if (func === 'cos' || resultFunc === 'cos') {
                signPositive = quadrant === 0 || quadrant === 3;
            } else if (func === 'tg' || resultFunc === 'tg') {
                signPositive = quadrant === 0 || quadrant === 2;
            } else if (func === 'ctg' || resultFunc === 'ctg') {
                signPositive = quadrant === 0 || quadrant === 2;
            }
            
            sign = signPositive ? '+' : '-';
            
            const quadrantNames = ['I', 'II', 'III', 'IV'];
            const quadrantRanges = ['0°—90°', '90°—180°', '180°—270°', '270°—360°'];
            
            steps.push({
                title: 'Определяем знак',
                content: `Угол ${fullAngle}° находится в ${quadrantNames[quadrant]} четверти (${quadrantRanges[quadrant]}). В этой четверти ${resultFunc} ${signPositive ? 'положителен' : 'отрицателен'}.`,
                formula: `Знак: ${sign === '+' ? '+' : '-'}`
            });
            
            // Step 4: Apply formula
            const formulaMap = {
                '90+': { sin: 'cos α', cos: '-sin α', tg: '-ctg α', ctg: '-tg α' },
                '90-': { sin: 'cos α', cos: 'sin α', tg: 'ctg α', ctg: 'tg α' },
                '180+': { sin: '-sin α', cos: '-cos α', tg: 'tg α', ctg: 'ctg α' },
                '180-': { sin: 'sin α', cos: '-cos α', tg: '-tg α', ctg: '-ctg α' },
                '270+': { sin: '-cos α', cos: 'sin α', tg: '-ctg α', ctg: '-tg α' },
                '270-': { sin: '-cos α', cos: '-sin α', tg: 'ctg α', ctg: 'tg α' },
                '360+': { sin: 'sin α', cos: 'cos α', tg: 'tg α', ctg: 'ctg α' },
                '360-': { sin: '-sin α', cos: 'cos α', tg: '-tg α', ctg: '-ctg α' }
            };
            
            const formula = formulaMap[baseFormula][func];
            
            steps.push({
                title: 'Применяем формулу приведения',
                content: `По таблице формул приведения для ${baseAngle}° ${operation} α:`,
                formula: `${func}(${baseAngle}° ${operation} α) = ${formula}`
            });
            
            // Step 5: Substitute and calculate
            const values = {
                0: { sin: 0, cos: 1, tg: 0, ctg: '—' },
                30: { sin: '1/2', cos: '√3/2', tg: '√3/3', ctg: '√3' },
                45: { sin: '√2/2', cos: '√2/2', tg: 1, ctg: 1 },
                60: { sin: '√3/2', cos: '1/2', tg: '√3', ctg: '√3/3' }
            };
            
            let finalValue = values[alpha] ? values[alpha][resultFunc] : '?';
            let finalAnswer = `${sign === '-' ? '-' : ''}${resultFunc} ${alpha}°`;
            
            if (values[alpha]) {
                finalAnswer += ` = ${sign === '-' ? '-' : ''}${finalValue}`;
            }
            
            steps.push({
                title: 'Подставляем значение',
                content: `Подставляем α = ${alpha}° и вычисляем:`,
                formula: finalAnswer
            });
            
            // Update display
            document.getElementById('expression').textContent = `${func}(${baseAngle}° ${operation} ${alpha}°)`;
            document.getElementById('answer').textContent = finalAnswer;
            
            // Render steps
            const stepsContainer = document.getElementById('stepsContainer');
            stepsContainer.innerHTML = '';
            
            steps.forEach((step, index) => {
                const stepDiv = document.createElement('div');
                stepDiv.className = 'step';
                stepDiv.innerHTML = `
                    <div class="step-title">
                        <span class="step-number">${index + 1}</span>
                        ${step.title}
                    </div>
                    <div class="step-content">
                        ${step.content}
                        <div class="step-formula">${step.formula}</div>
                    </div>
                `;
                stepsContainer.appendChild(stepDiv);
            });
            
            drawCircle(fullAngle, alpha);
        }
        
        function drawCircle(fullAngle, alpha) {
            const canvas = document.getElementById('circleCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 150;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw axes
            ctx.strokeStyle = '#9CA3AF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, canvas.height);
            ctx.stroke();
            
            // Draw circle
            ctx.strokeStyle = '#FBBF24';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.stroke();
            
            // Draw full angle
            const fullRad = (fullAngle * Math.PI) / 180;
            const fullX = centerX + Math.cos(-fullRad) * radius;
            const fullY = centerY + Math.sin(-fullRad) * radius;
            
            ctx.strokeStyle = '#22D3EE';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(fullX, fullY);
            ctx.stroke();
            
            // Draw point
            ctx.fillStyle = '#22D3EE';
            ctx.beginPath();
            ctx.arc(fullX, fullY, 8, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw angle arc
            ctx.strokeStyle = '#FBBF24';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 50, 0, -fullRad, true);
            ctx.stroke();
            
            // Draw angle label
            ctx.fillStyle = '#FBBF24';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(fullAngle + '°', centerX + 60, centerY - 10);
        }
        
        function generateRandom() {
            const functions = ['sin', 'cos', 'tg', 'ctg'];
            const formulas = ['90+', '90-', '180+', '180-', '270+', '270-', '360+', '360-'];
            const angles = [0, 30, 45, 60];
            
            document.getElementById('functionSelect').value = functions[Math.floor(Math.random() * functions.length)];
            document.getElementById('baseFormulaSelect').value = formulas[Math.floor(Math.random() * formulas.length)];
            document.getElementById('angleInput').value = angles[Math.floor(Math.random() * angles.length)];
            
            const buttons = document.querySelectorAll('.angle-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            calculate();
        }
        
        // Initial calculation
        calculate();
    </script>
</body>
</html>
